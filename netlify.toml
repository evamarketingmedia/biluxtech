# Sito statico: nessun comando di build, si pubblica la cartella public/
[build]
  publish = "public"
  command = ""

# Intestazioni di sicurezza
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Font e immagini cambiano raramente: cache lunga
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Vecchio dominio www → dominio principale (se www punta a Netlify)
[[redirects]]
  from = "https://www.biluxtech.com/*"
  to = "https://biluxtech.com/:splat"
  status = 301
  force = true
